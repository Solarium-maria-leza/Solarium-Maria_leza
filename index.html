<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maria Leza - Bonos</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --oro:#ECCD7B; --crema:#FCF6F2; --arena:#E5DFD7;
    --grafito:#3A3A3A; --tinta:#121212; --alerta:#C2543F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--crema);color:var(--grafito);
    font-family:"Assistant",system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

  #reposo{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:4vh;padding:6vh 8vw;text-align:center;background:var(--crema)}
  #reposo::after{content:"";position:absolute;inset:2.5vh 2.5vw;border:1px solid var(--arena);pointer-events:none}
  .marca{display:flex;flex-direction:column;align-items:center;gap:.8vh}
  .marca-nombre{font-weight:200;font-size:clamp(44px,7.5vw,104px);letter-spacing:.14em;color:var(--tinta);line-height:1}
  .marca-sub{font-weight:300;font-size:clamp(13px,1.7vw,22px);letter-spacing:.46em;color:#8A8178;padding-left:.46em}
  .filete{width:84px;height:1px;background:var(--oro)}
  .claim{font-weight:300;font-size:clamp(16px,2.2vw,26px);letter-spacing:.2em;
    text-transform:uppercase;color:#8A8178}
  .instruccion{font-weight:300;font-size:clamp(22px,3.2vw,40px);line-height:1.4;max-width:20ch}
  .instruccion b{font-weight:700;color:var(--tinta)}

  #msg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:1.5vh;padding:6vw;text-align:center;background:var(--crema);z-index:20}
  #msg.show{display:flex}
  #msg .nombre{font-weight:300;font-size:clamp(30px,5vw,62px);color:var(--grafito)}
  #msg .grande{font-weight:700;font-size:clamp(120px,27vw,320px);line-height:.85;
    letter-spacing:-.04em;color:var(--tinta)}
  #msg .sello{width:120px;height:3px;background:var(--oro);margin:1vh 0}
  #msg .pie{font-weight:500;font-size:clamp(22px,3.2vw,40px);max-width:22ch;line-height:1.25;color:#6E665E}
  #msg .det{margin-top:2.2vh;font-weight:400;font-size:clamp(17px,2.2vw,28px);color:#8d847c;line-height:1.5;min-height:1.5em}
  #msg .det b{color:var(--grafito);font-weight:600}
  #msg .aviso{display:inline-block;margin-top:1.2vh;padding:.35em 1em;border-radius:99px;background:#FBEFD6;color:#9a6b00;font-weight:600}
  #msg .aviso.rojo{background:#fdeceb;color:var(--alerta)}
  #msg.bad .grande{color:var(--alerta);font-size:clamp(80px,14vw,180px)}
  #msg.bad .pie{color:var(--alerta)}
  #msg.wait .grande{color:var(--oro)}

  #camara{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:3vh;background:var(--crema);padding:4vh;z-index:30}
  #camara.show{display:flex}
  #camara h2{font-weight:300;font-size:clamp(20px,2.6vw,30px);letter-spacing:.16em;
    text-transform:uppercase;color:#8A8178}
  #reader{width:min(70vw,56vh);aspect-ratio:1;overflow:hidden;
    outline:2px solid var(--oro);outline-offset:10px;background:#000}
  #reader video{width:100%!important;height:100%!important;object-fit:cover}
  #reader img{display:none}
  #cerrarCam{margin-top:1vh;padding:14px 34px;border:1px solid var(--arena);background:#fff;
    font-family:inherit;font-weight:500;font-size:17px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--grafito)}

  #secreta{position:fixed;right:0;bottom:0;width:14vw;height:12vh;z-index:50}
  #estado{position:fixed;bottom:1.4vh;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C3BAB0;z-index:40}
  @media (prefers-reduced-motion:no-preference){
    #msg.show{animation:fundido .3s ease-out}
    @keyframes fundido{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>

<div id="reposo">
  <div class="marca">
    <span class="marca-nombre">MARÍA LEZA</span>
    <span class="marca-sub">ESTETICISTAS</span>
  </div>
  <div class="filete"></div>
  <p class="claim">Centro de estética · Logroño</p>
  <p class="instruccion">Presenta tu <b>código QR</b> en recepción para validar tu sesión</p>
</div>

<div id="msg" aria-live="assertive">
  <div class="nombre" id="mNombre"></div>
  <div class="grande" id="mGrande"></div>
  <div class="sello"></div>
  <div class="pie" id="mPie"></div>
  <div class="det" id="mDet"></div>
</div>

<div id="camara">
  <h2>Lector de respaldo</h2>
  <div id="reader"></div>
  <button id="cerrarCam">Cerrar</button>
</div>

<div id="secreta"></div>
<div id="estado">Cargando…</div>

<script>
  var VERSION = 'v7';
  var SEGUNDOS_MENSAJE = 7;
  var SEGUNDOS_ANTIDOBLE = 30;
  var API_URL = 'https://script.google.com/macros/s/AKfycbx380QtvCnx_XcnyUAm-iajIvkTbh5E4HlEz2qMxPelLIJlX-jS8_SKR_R-NTWMBPnNfA/exec';

  var ocupado = false, ultimo = { id:'', t:0 }, clientes = {}, ultimaPasada = {};
  var scanner = null, camaraActiva = false;

  function beep(bueno){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value = bueno?880:220; g.gain.value=.22;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + (bueno?.15:.4));
    }catch(e){}
  }

  function cargarLista(){
    fetch(API_URL + '?lista=1&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(arr){
        var m = {}; arr.forEach(function(c){ m[c.id] = c; });
        clientes = m;
        document.getElementById('estado').textContent = VERSION + ' · ' + arr.length + ' clientes';
      })
      .catch(function(){ document.getElementById('estado').textContent = 'Sin conexión · reintentando'; });
  }

  var infoCache = {};
  function pintarDetalle(id, restantes){
    var det = document.getElementById('mDet');
    var c = clientes[id] || {};
    var html = function(info){
      var partes = [];
      var total = (info && info.sesiones) || c.bono;
      if(typeof restantes === 'number' && total) partes.push('Te quedan <b>' + restantes + '</b> de ' + total);
      if(info && info.compra) partes.push('Comprado el <b>' + info.compra + '</b>');
      if(info && info.caducidad) partes.push('Caduca el <b>' + info.caducidad + '</b>');
      var out = partes.join(' · ');
      if(info && info.caducado) out += '<br><span class="aviso rojo">Bono caducado · pasa por recepción</span>';
      else if(typeof restantes === 'number' && restantes <= 0) out += '<br><span class="aviso rojo">Bono agotado · pregunta por la renovación</span>';
      else if(typeof restantes === 'number' && restantes <= 2) out += '<br><span class="aviso">Te quedan pocas · pregunta por la renovación</span>';
      det.innerHTML = out;
    };
    html(infoCache[id]);
    if(!id) return;
    fetch(API_URL + '?bono=' + encodeURIComponent(id) + '&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(info){ if(info && info.ok !== false){ infoCache[id] = info; if(document.getElementById('msg').dataset.id === id) html(info); } })
      .catch(function(){});
  }

  function pintar(res, conTemporizador){
    var m = document.getElementById('msg');
    var ok = res.ok && !res.repetido;
    m.classList.remove('wait');
    m.classList.toggle('bad', !ok);
    document.getElementById('mNombre').textContent = res.nombre || '';
    m.dataset.id = res.id || '';
    document.getElementById('mDet').innerHTML = '';
    var srv = res.servicio ? ' de ' + res.servicio : '';
    if(ok){
      document.getElementById('mGrande').textContent = res.restantes;
      document.getElementById('mPie').textContent = (res.restantes === 1
        ? 'sesión restante' : 'sesiones restantes') + srv;
    } else if(res.repetido){
      document.getElementById('mGrande').textContent = res.restantes;
      document.getElementById('mPie').textContent = 'Visita ya registrada';
    } else {
      document.getElementById('mGrande').textContent = '—';
      document.getElementById('mPie').textContent = res.msg || 'No se pudo registrar';
    }
    if(res.id && (ok || res.repetido || res.nombre)) pintarDetalle(res.id, typeof res.restantes === 'number' ? res.restantes : undefined);
    beep(ok);
    m.classList.add('show');
    if(conTemporizador){
      setTimeout(function(){ m.classList.remove('show'); ocupado = false; }, SEGUNDOS_MENSAJE*1000);
    }
  }

  function llamar(id, enSegundoPlano){
    var done = function(res){
      if(enSegundoPlano){
        if(!res.ok || res.repetido){ res.id = id; pintar(res, false); }
        if(clientes[id] && typeof res.restantes === 'number'){
          clientes[id].usadas = (clientes[id].bono||0) - res.restantes;
        }
      } else { res.id = id; pintar(res, true); }
    };
    var fallo = function(){ if(!enSegundoPlano) pintar({ok:false, msg:'Sin conexión. Inténtalo de nuevo'}, true); };
    var nonce = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    fetch(API_URL + '?id=' + encodeURIComponent(id) + '&n=' + nonce, {cache:'no-store'})
      .then(function(r){ return r.json(); }).then(done).catch(fallo);
  }

  function procesar(texto){
    var id = String(texto||'').trim().toUpperCase();
    var ahora = Date.now();
    if(!id || ocupado) return;
    if(id === ultimo.id && ahora - ultimo.t < 5000) return;
    ultimo = { id:id, t:ahora };
    ocupado = true;
    if(camaraActiva) cerrarCamara();

    var c = clientes[id];
    if(c){
      if(ultimaPasada[id] && ahora - ultimaPasada[id] < SEGUNDOS_ANTIDOBLE*1000){
        pintar({id:id, ok:true, repetido:true, nombre:c.nombre, servicio:c.servicio, restantes:c.bono - c.usadas}, true);
        return;
      }
      var restantes = c.bono - c.usadas;
      if(restantes <= 0){
        pintar({id:id, ok:false, nombre:c.nombre, servicio:c.servicio, msg:'Sin sesiones · pasa por recepción', restantes:0}, true);
        return;
      }
      c.usadas += 1;
      ultimaPasada[id] = ahora;
      pintar({id:id, ok:true, nombre:c.nombre, servicio:c.servicio, restantes:restantes-1}, true);
      llamar(id, true);
    } else {
      var m = document.getElementById('msg');
      m.classList.remove('bad'); m.classList.add('wait');
      document.getElementById('mNombre').textContent = '';
      document.getElementById('mGrande').textContent = '·';
      document.getElementById('mPie').textContent = 'Comprobando…';
      beep(true); m.classList.add('show');
      llamar(id, false);
      cargarLista();
    }
  }

  var buffer = '';
  document.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ var v = buffer; buffer=''; if(v) procesar(v); return; }
    if(ev.key.length === 1){ buffer += ev.key; setTimeout(function(){ buffer=''; }, 800); }
  });

  var cierre = Promise.resolve();
  function abrirCamara(){
    if(camaraActiva) return;
    camaraActiva = true;
    document.getElementById('camara').classList.add('show');
    // Al abrir la cámara se limpia el mensaje anterior para que el siguiente QR no se ignore
    document.getElementById('msg').classList.remove('show');
    ocupado = false; ultimo = { id:'', t:0 };
    cierre.then(function(){
      if(!camaraActiva) return;
      scanner = new Html5Qrcode('reader', { formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE] });
      var lado = Math.min(window.innerWidth, window.innerHeight) * .6;
      var leido = function(t){ if(camaraActiva) procesar(t); };
      scanner.start({facingMode:'user'}, {fps:10, qrbox:{width:lado*.8, height:lado*.8}}, leido, function(){})
        .catch(function(){
          scanner.start({facingMode:'environment'}, {fps:10}, leido, function(){})
            .catch(function(){ document.getElementById('estado').textContent = 'Cámara no disponible'; });
        });
    });
  }
  function cerrarCamara(){
    if(!camaraActiva) return;
    camaraActiva = false;
    document.getElementById('camara').classList.remove('show');
    var s = scanner; scanner = null;
    cierre = new Promise(function(res){
      setTimeout(function(){
        if(!s) return res();
        Promise.resolve().then(function(){ return s.stop(); }).catch(function(){})
          .then(function(){ try{ s.clear(); }catch(e){} res(); });
      }, 0);
    });
  }
  // Lector de respaldo: mantener pulsada la esquina inferior derecha 3 segundos
  var tempLargo = null;
  var secreta = document.getElementById('secreta');
  secreta.style.cssText += ';width:max(110px,20vw);height:max(110px,16vh);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 16px 14px 0';
  secreta.innerHTML = '<span id="secretaIcono" style="font-size:24px;opacity:.2;transition:opacity .2s,transform 3s linear;pointer-events:none">📷</span>';
  var icono = document.getElementById('secretaIcono');
  function resetIcono(){ icono.style.transition = 'opacity .2s'; icono.style.opacity = '.2'; icono.style.transform = 'scale(1)'; }
  function empezarPulsacion(e){
    if (e.cancelable) e.preventDefault();
    if (tempLargo) return;
    icono.style.transition = 'opacity .2s,transform 3s linear'; icono.style.opacity = '.9'; icono.style.transform = 'scale(1.8)';
    tempLargo = setTimeout(function(){ tempLargo = null; resetIcono(); abrirCamara(); }, 3000);
  }
  function soltarPulsacion(){ if (tempLargo) { clearTimeout(tempLargo); tempLargo = null; } resetIcono(); }
  secreta.addEventListener('touchstart', empezarPulsacion, { passive: false });
  secreta.addEventListener('touchend', soltarPulsacion);
  secreta.addEventListener('touchcancel', soltarPulsacion);
  secreta.addEventListener('mousedown', empezarPulsacion);
  secreta.addEventListener('mouseup', soltarPulsacion);
  secreta.addEventListener('mouseleave', soltarPulsacion);
  secreta.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.getElementById('cerrarCam').addEventListener('click', cerrarCamara);

  cargarLista();
  setInterval(cargarLista, 60000);
</script>
</body>
</html>
